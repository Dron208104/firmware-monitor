<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B0B0C"><title>Смена пароля — Firmware Monitor</title><link rel="stylesheet" href="/static/style.css?v=20260908-20"><link rel="stylesheet" href="/static/auth.css?v=4"></head><body class="login-page"><main class="login-shell"><section class="login-card first-password-card"><div class="login-brand"><img src="/static/firmware-monitor-logo.png" alt="" width="64"><div><strong>Firmware Monitor</strong><small>Контроль сетевого оборудования</small></div></div><em>ПЕРВЫЙ ВХОД</em><h1>Создайте новый пароль</h1><p>Временный пароль необходимо заменить перед началом работы.</p><div class="security-note">Используйте не менее 8 символов. Новый пароль должен отличаться от временного.</div>{% if error %}<div class="auth-error" role="alert">{{error}}</div>{% endif %}<form method="post" action="/change-password"><input type="hidden" name="csrf" value="{{csrf}}"><label>Новый пароль<input type="password" name="password" minlength="8" autocomplete="new-password" required autofocus></label><label>Повторите новый пароль<input type="password" name="confirmation" minlength="8" autocomplete="new-password" required></label><button class="btn primary" type="submit">Сохранить и продолжить</button></form><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{csrf}}"><button class="btn secondary" type="submit">Выйти</button></form></section></main></body></html>

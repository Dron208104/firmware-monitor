<link rel="stylesheet" href="/static/source-choice-fix.css?v=1"><div class="modal" id="device-modal" hidden><div class="modal-backdrop" data-close-modal></div><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="device-modal-title"><header><div><em>НОВОЕ УСТРОЙСТВО</em><h2 id="device-modal-title">Добавить устройство</h2><p id="device-modal-subtitle">Получение версии прошивки по SNMP</p></div><button type="button" class="modal-close" data-close-modal aria-label="Закрыть">×</button></header><form id="device-create-form" novalidate><input type="hidden" name="csrf" value="{{csrf}}"><div class="modal-scroll"><div class="form-error" data-error="form"></div><div class="modal-grid">
<label><span>Название <b>*</b></span><input name="name" maxlength="120" required><small data-error="name"></small></label><label><span>IP-адрес <b>*</b></span><input name="address" inputmode="decimal" maxlength="15" placeholder="192.168.1.10" required><small data-error="address"></small></label>
<fieldset class="wide device-icon-picker"><legend>Иконка оборудования</legend><div class="device-icon-options"><label><input type="radio" name="icon_type" value="switch" checked><span>{{icon('switch')}}<b>Коммутатор</b><small>Порты Ethernet</small></span></label><label><input type="radio" name="icon_type" value="router"><span>{{icon('router')}}<b>Маршрутизатор</b><small>Маршрутизация сети</small></span></label></div></fieldset>
<label><span>Производитель <b>*</b></span><select name="vendor_id" required><option value="">Выберите производителя</option></select><small data-error="vendor_id"></small></label><label><span>Модель <b>*</b></span><select name="model_id" disabled><option value="">Сначала выберите производителя</option></select><input name="custom_model" maxlength="120" placeholder="Введите модель" hidden disabled><small data-error="model_id"></small><small data-error="custom_model"></small></label>
<label class="wide" data-hardware-revision hidden><span>Аппаратная ревизия <b>*</b></span><select name="hardware_revision" disabled><option value="">Выберите ревизию</option></select><small class="field-help">Указана на наклейке устройства. Прошивки разных аппаратных ревизий могут быть несовместимы.</small><small data-error="hardware_revision"></small></label>
<div class="wide model-warning" id="model-warning" hidden>Указана серия или неполное название модели. Уточните полную модификацию с корпуса устройства или из команды show version, чтобы сервис выбрал совместимую прошивку.</div>
<fieldset class="wide source-choice"><legend>Источник установленной версии</legend><div class="source-tabs"><label><input type="radio" name="version_source" value="snmp" checked><span>По SNMP</span></label><label><input type="radio" name="version_source" value="manual"><span>Вручную</span></label></div><small data-error="version_source"></small></fieldset>
<div class="wide source-fields" data-source="snmp"><div class="modal-grid"><label class="wide snmp-profile"><span>Профиль подключения</span><select name="profile_id" data-create-profile><option value="">Индивидуальные настройки устройства</option></select><small>Выберите готовый профиль или настройте SNMP только для этого устройства.</small><small data-error="profile_id"></small></label><div class="wide direct-snmp-fields" data-direct-snmp><div class="modal-grid"><label><span>Версия SNMP</span><select name="snmp_version"><option value="2c" selected>SNMPv2c</option><option value="3">SNMPv3</option></select><small data-error="snmp_version"></small></label><label><span>Порт</span><input type="number" name="snmp_port" value="161" min="1" max="65535"><small data-error="snmp_port"></small></label><label class="wide" data-snmp="2c"><span>Community <b>*</b></span><input type="password" name="community" autocomplete="new-password"><small data-error="community"></small></label><div class="wide snmpv3" data-snmp="3" hidden><div class="modal-grid"><label><span>Username <b>*</b></span><input name="snmpv3_username"><small data-error="snmpv3_username"></small></label><label><span>Уровень безопасности</span><select name="security_level"><option value="noAuthNoPriv">noAuthNoPriv</option><option value="authNoPriv">authNoPriv</option><option value="authPriv">authPriv</option></select><small data-error="security_level"></small></label><label data-security="auth"><span>Authentication protocol</span><select name="auth_protocol"><option value="SHA">SHA</option><option value="MD5">MD5</option></select><small data-error="auth_protocol"></small></label><label data-security="auth"><span>Authentication password</span><input type="password" name="auth_password" autocomplete="new-password"><small data-error="auth_password"></small></label><label data-security="privacy"><span>Privacy protocol</span><select name="privacy_protocol"><option value="AES">AES</option><option value="DES">DES</option></select><small data-error="privacy_protocol"></small></label><label data-security="privacy"><span>Privacy password</span><input type="password" name="privacy_password" autocomplete="new-password"><small data-error="privacy_password"></small></label></div></div></div></div><label class="wide modal-check"><input type="checkbox" name="auto_check" checked><span>Проверять версию автоматически по SNMP</span></label></div></div>
<div class="wide source-fields" data-source="manual" hidden><label><span>Установленная версия <b>*</b></span><input name="installed_version" disabled><small class="field-help">Актуальная версия определяется по официальному источнику производителя.</small><small data-error="installed_version"></small></label></div>
<label class="wide"><span>Каталог</span><select name="folder_id" id="device-folder"><option value="">Без каталога</option></select><small data-error="folder_id"></small></label>
<label class="wide"><span>Комментарий</span><textarea name="description" maxlength="1000" rows="2" placeholder="Например: серверная, стойка 2"></textarea></label></div></div><footer><button type="button" class="btn secondary" data-close-modal>Отмена</button><button class="btn primary" type="submit">Добавить устройство</button></footer></form></section></div>

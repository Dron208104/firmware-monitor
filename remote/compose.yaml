services:
  app:
    image: ${FIRMWARE_MONITOR_IMAGE:-firmware-monitor:1.1.1}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.1.1}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - firmware_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  firmware_data:

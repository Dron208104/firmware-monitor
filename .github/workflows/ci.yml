name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote
    env:
      ENCRYPTION_KEY: qh0iM4XlbVuD8xHfYkK_CPRDntL-Tb1vQG5o2eM0HUE=
      AUTH_DISABLED: "true"
      DATABASE_URL: sqlite:////tmp/firmware-monitor-tests.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: remote/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: pytest -q
      - run: docker compose config --quiet
      - run: docker build --build-arg APP_VERSION=ci -t firmware-monitor:ci .

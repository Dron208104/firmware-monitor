<div class="modal" id="device-modal" hidden><div class="modal-backdrop" data-close-modal></div><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="device-modal-title"><header><div><em>НОВОЕ УСТРОЙСТВО</em><h2 id="device-modal-title">Добавить устройство</h2><p id="device-modal-subtitle">Получение версии прошивки по SNMP</p></div><button type="button" class="modal-close" data-close-modal aria-label="Закрыть">×</button></header><form id="device-create-form" novalidate><input type="hidden" name="csrf" value="{{csrf}}"><div class="modal-scroll"><div class="form-error" data-error="form"></div><div class="modal-grid">
<label>Название <b>*</b><input name="name" maxlength="120" required><small data-error="name"></small></label><label>IP-адрес <b>*</b><input name="address" inputmode="decimal" maxlength="15" placeholder="192.168.1.10" required><small data-error="address"></small></label>
<label>Производитель <b>*</b><select name="vendor_id" required><option value="">Выберите производителя</option></select><small data-error="vendor_id"></small></label><label><span>Модель <b>*</b></span><select name="model_id" disabled><option value="">Сначала выберите производителя</option></select><input name="custom_model" maxlength="120" placeholder="Введите модель" hidden disabled><small data-error="model_id"></small><small data-error="custom_model"></small></label>
<label class="wide">Источник установленной версии<div class="source-tabs"><label><input type="radio" name="version_source" value="snmp" checked><span>По SNMP</span></label><label><input type="radio" name="version_source" value="manual"><span>Вручную</span></label></div><small data-error="version_source"></small></label>
<div class="wide source-fields" data-source="snmp"><div class="modal-grid"><label>Версия SNMP<select name="snmp_version"><option value="2c" selected>SNMPv2c</option><option value="3">SNMPv3</option></select><small data-error="snmp_version"></small></label><label>Порт<input type="number" name="snmp_port" value="161" min="1" max="65535"><small data-error="snmp_port"></small></label><label class="wide" data-snmp="2c">Community <b>*</b><input type="password" name="community" autocomplete="new-password"><small data-error="community"></small></label><div class="wide snmpv3" data-snmp="3" hidden><div class="modal-grid"><label>Username <b>*</b><input name="snmpv3_username"><small data-error="snmpv3_username"></small></label><label>Уровень безопасности<select name="security_level"><option value="noAuthNoPriv">noAuthNoPriv</option><option value="authNoPriv">authNoPriv</option><option value="authPriv">authPriv</option></select><small data-error="security_level"></small></label><label data-security="auth">Authentication protocol<select name="auth_protocol"><option value="SHA">SHA</option><option value="MD5">MD5</option></select><small data-error="auth_protocol"></small></label><label data-security="auth">Authentication password<input type="password" name="auth_password" autocomplete="new-password"><small data-error="auth_password"></small></label><label data-security="privacy">Privacy protocol<select name="privacy_protocol"><option value="AES">AES</option><option value="DES">DES</option></select><small data-error="privacy_protocol"></small></label><label data-security="privacy">Privacy password<input type="password" name="privacy_password" autocomplete="new-password"><small data-error="privacy_password"></small></label></div></div><label class="wide modal-check"><input type="checkbox" name="auto_check" checked>Проверять версию автоматически по SNMP</label></div></div>
<div class="wide source-fields" data-source="manual" hidden><label>Установленная версия <b>*</b><input name="installed_version" disabled><small class="field-help">Актуальная версия определяется по официальному источнику производителя.</small><small data-error="installed_version"></small></label></div>
<label class="wide">Описание<textarea name="description" maxlength="1000" rows="2"></textarea></label></div></div><footer><button type="button" class="btn secondary" data-close-modal>Отмена</button><button class="btn primary" type="submit">Добавить устройство</button></footer></form></section></div>

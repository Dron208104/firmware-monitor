{% extends 'base.html' %}{% block content %}<header><div><em>ОБОРУДОВАНИЕ</em><h1>{{'Редактирование устройства' if device else 'Новое устройство'}}</h1><p>Параметры коммутатора и способ получения версии прошивки</p></div></header><form class="card form" method="post" action="/devices/save"><input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="device_id" value="{{device.id if device else ''}}"><label>Понятное имя<input required name="name" value="{{device.name if device else ''}}"></label><label>IP-адрес<input required name="ip_address" value="{{device.ip_address if device else ''}}"></label><label>Производитель<select name="vendor">{% for v in ['QTECH','Eltex','D-Link'] %}<option {{'selected' if device and device.vendor==v}}>{{v}}</option>{% endfor %}</select></label><label>Модель<input required name="model" value="{{device.model if device else ''}}"></label><label>Аппаратная ревизия<input name="hardware_revision" value="{{device.hardware_revision or '' if device else ''}}"></label><label>Установленная версия<input name="installed_version" value="{{device.installed_version or '' if device else ''}}"></label><label>Получение версии<select name="acquisition_method">{% for v in ['manual','snmp','ssh'] %}<option {{'selected' if device and device.acquisition_method==v}} value="{{v}}">{{v|upper}}</option>{% endfor %}</select></label><label>Профиль подключения<select name="profile_id"><option value="">Без профиля</option>{% for p in profiles %}<option value="{{p.id}}" {{'selected' if device and device.profile_id==p.id}}>{{p.name}}</option>{% endfor %}</select></label><label class="wide">Официальная страница прошивок<input type="url" name="official_url" value="{{device.official_url or '' if device else ''}}"></label><label class="check"><input type="checkbox" name="auto_check" {{'checked' if not device or device.auto_check}}>Автоматическая проверка</label><div class="wide form-actions"><a class="btn secondary" href="/">Отмена</a><button class="btn primary">Сохранить устройство</button></div></form>{% endblock %}
